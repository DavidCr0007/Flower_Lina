<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Una tarjeta de cumpleaños interactiva para Lina.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#F4ECD8">
    <link rel="canonical" href="https://davidcr0007.github.io/Flower_Lina/">
    <!-- Vista previa del enlace en WhatsApp -->
    <meta property="og:title" content="Tengo algo para ti, Lina">
    <meta property="og:description" content="Toca para abrir">
    <meta property="og:url" content="https://davidcr0007.github.io/Flower_Lina/">
    <meta property="og:image" content="https://davidcr0007.github.io/Flower_Lina/Flores/Ramo_Girasoles.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:alt" content="Ramo de girasoles">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_CO">
    <meta property="og:site_name" content="Flor para Lina">
    <meta name="twitter:card" content="summary_large_image">
    <title>Tengo algo para ti</title>
    <link rel="preload" href="audio/bff.m4a" as="audio" type="audio/mp4">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- 1) Apertura: el toque desbloquea el sonido en celulares -->
    <section id="gate" class="etapa activa" role="button" tabindex="0" aria-label="Abrir el regalo">
        <svg id="gate-flor" viewBox="0 0 200 200" aria-hidden="true"></svg>
        <h1 id="gate-titulo"></h1>
        <p>Toca para abrir</p>
    </section>

    <!-- 2) Intro: cumpleaños, trompetas y pastel -->
    <section id="intro" class="etapa" aria-live="polite">
        <div class="trompeta izq" aria-hidden="true"></div>
        <div class="trompeta der" aria-hidden="true"></div>
        <h2 id="t1"></h2>
        <div class="nombre" id="t2"></div>
        <svg class="tarta" viewBox="0 0 200 190" aria-hidden="true">
            <defs>
                <clipPath id="cpTarta">
                    <rect x="50" y="76" width="100" height="46" rx="10" />
                </clipPath>
            </defs>
            <ellipse cx="100" cy="180" rx="92" ry="8" fill="rgba(31,78,121,.15)" />
            <rect x="18" y="120" width="164" height="58" rx="12" fill="#3E6E8E" />
            <g fill="#fff">
                <rect x="18" y="120" width="164" height="14" rx="7" />
                <circle cx="36" cy="136" r="8" />
                <circle cx="68" cy="138" r="9" />
                <circle cx="104" cy="136" r="8" />
                <circle cx="136" cy="139" r="9" />
                <circle cx="166" cy="136" r="8" />
            </g>
            <rect x="50" y="76" width="100" height="46" rx="10" fill="#fff" />
            <g clip-path="url(#cpTarta)" fill="#3E6E8E">
                <rect x="50" y="76" width="20" height="46" />
                <rect x="90" y="76" width="20" height="46" />
                <rect x="130" y="76" width="20" height="46" />
            </g>
            <rect x="75" y="52" width="6" height="26" rx="2" fill="#A8556A" />
            <rect x="97" y="52" width="6" height="26" rx="2" fill="#B8923A" />
            <rect x="119" y="52" width="6" height="26" rx="2" fill="#A8556A" />
            <ellipse class="llama" cx="78" cy="45" rx="5" ry="8" fill="#B8923A" />
            <ellipse class="llama" cx="100" cy="45" rx="5" ry="8" fill="#B8923A" style="animation-delay:-.15s" />
            <ellipse class="llama" cx="122" cy="45" rx="5" ry="8" fill="#B8923A" style="animation-delay:-.3s" />
        </svg>
        <div class="edad" id="edad"><b></b><span>años</span></div>
    </section>

    <!-- 3) Jardín: fotos al fondo, girasoles y ramo al centro -->
    <section id="jardin" class="etapa" aria-label="Jardín">
        <svg class="banderines" aria-hidden="true">
            <defs>
                <pattern id="bd" width="128" height="56" patternUnits="userSpaceOnUse">
                    <path d="M4 8 L32 50 L60 8 Z" fill="#3E6E8E" />
                    <path d="M68 8 L96 50 L124 8 Z" fill="#F4ECD8" stroke="#3E6E8E" stroke-width="2"
                        stroke-linejoin="round" />
                </pattern>
            </defs>
            <rect width="100%" height="56" fill="url(#bd)" />
            <rect width="100%" height="4" y="6" fill="#173A57" opacity=".35" />
        </svg>
        <div id="dedicatoria"></div>
        <div id="fondo-flores" aria-hidden="true"></div>
        <div id="fotos"></div>
        <div class="suelo"></div>
        <svg id="escena" viewBox="0 0 400 700" preserveAspectRatio="xMidYMax meet"></svg>
        <div id="petalos"></div>
    </section>

    <!-- 4) Carta en pergamino -->
    <div id="carta" role="dialog" aria-modal="true" aria-label="Carta" inert>
        <div class="pergamino" id="pergamino">
            <div class="vara"></div>
            <div class="papel" id="papel">
                <div class="contenido" id="contenido"></div>
            </div>
            <div class="vara"></div>
            <button class="cerrar" id="cerrar" type="button">Volver al jardín</button>
        </div>
    </div>

    <button id="musica" type="button" aria-label="Silenciar o activar la música" hidden>♪</button>
    <div id="visor" role="dialog" aria-modal="true" aria-label="Foto ampliada" inert>
        <img alt="">
        <button id="cerrar-visor" type="button" aria-label="Cerrar foto ampliada">×</button>
    </div>
    <canvas id="confeti"></canvas>

    <script src="assets/js/app.js" defer></script>
</body>

</html>
